<!DOCTYPE html>
<html data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>CKS</title>
    <meta name="description" content="CKS Scholarship Website for the Alpha Epsilon Chapter of Phi Kappa Sigma">
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:300,400,700&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Actor&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Arbutus+Slab">
    <link rel="stylesheet" href="static/css/404-NOT-FOUND-animated-v2.compiled.css">
    <link rel="stylesheet" href="static/css/Animated-Text-Background.css">
    <link rel="stylesheet" href="static/css/Background-Image---Parallax---No-Text.css">
    <link rel="stylesheet" href="static/css/Login-Form-Basic-icons.css">
    <link rel="stylesheet" href="static/css/pikaday.min.css">
</head>

<body>
    <div data-bss-parallax-bg="true" class="backgroundimages" style="background-image: url(static/img/password.jpg);"></div>
    <section class="position-relative py-4 py-xl-5">
        <div class="container">
            <div class="row mb-5">
                <div class="col-md-8 col-xl-6 text-center mx-auto">
                    <h2>Forgot Your Password?</h2>
                    <p class="w-lg-50">Provide your IIT Email to reset your password. You will get an email with your new password.</p>
                </div>
            </div>
            <div class="row d-flex justify-content-center">
                <div class="col-md-6 col-xl-4">
                    <div class="card mb-5">
                        <div class="card-body d-flex flex-column align-items-center">
                            <div class="bs-icon-xl bs-icon-circle bs-icon-primary bs-icon my-4"><svg xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 24 24" height="1em" viewBox="0 0 24 24" width="1em" fill="currentColor">
                                    <rect fill="none" height="24" width="24"></rect>
                                    <path d="M13,3c-4.97,0-9,4.03-9,9H1l4,4l4-4H6c0-3.86,3.14-7,7-7s7,3.14,7,7s-3.14,7-7,7c-1.9,0-3.62-0.76-4.88-1.99L6.7,18.42 C8.32,20.01,10.55,21,13,21c4.97,0,9-4.03,9-9S17.97,3,13,3z M15,11v-1c0-1.1-0.9-2-2-2s-2,0.9-2,2v1c-0.55,0-1,0.45-1,1v3 c0,0.55,0.45,1,1,1h4c0.55,0,1-0.45,1-1v-3C16,11.45,15.55,11,15,11z M14,11h-2v-1c0-0.55,0.45-1,1-1s1,0.45,1,1V11z"></path>
                                </svg></div>
                            <form class="text-center" method="post" action="/forgot_password">
                                <div class="mb-3"><input class="form-control" type="email" name="email" placeholder="IIT Email"></div>
                                <div class="mb-3"></div>
                                <div class="mb-3"><button class="btn btn-primary d-block w-100" type="submit">Rest Password</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="static/js/bootstrap.min.js"></script>
    <script src="static/js/bs-init.js"></script>
    <script src="static/js/Animated-Text-Background-animatedTextBackground.js"></script>
    <script src="static/js/pikaday.min.js"></script>
    <script src="static/js/theme.js"></script>
</body>

</html>
