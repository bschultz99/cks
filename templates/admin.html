<!DOCTYPE html>
<html data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Hire me - HCAEPKS</title>
    <meta name="description" content="CKS Scholarship Website for the Alpha Epsilon Chapter of Phi Kappa Sigma">
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:300,400,700&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Actor&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Arbutus+Slab">
    <link rel="stylesheet" href="static/css/404-NOT-FOUND-animated-v2.compiled.css">
    <link rel="stylesheet" href="static/css/Animated-Text-Background.css">
    <link rel="stylesheet" href="static/css/Background-Image---Parallax---No-Text.css">
    <link rel="stylesheet" href="static/css/Login-Form-Basic-icons.css">
    <link rel="stylesheet" href="static/css/pikaday.min.css">
</head>

<body>
    <main class="page" style="background: url(&quot;static/img/geometric-leaves.webp&quot;);">
        <section class="portfolio-block hire-me">
            <div class="container">
                <div class="heading">
                    <h2 style="color: var(--bs-secondary);font-weight: bold;font-size: 44px;text-shadow: 7px 9px 10px var(--bs-secondary);">CKS Administrative Portal</h2>
                </div>
                <form class="border rounded border-1 shadow-lg p-3 p-md-5" data-bs-theme="light" style="background: #ffffff;">
                    <input class="form-control" type="file", id="fileInput" accept=".csv">
                    <div class="mb-3"></div><button class="btn btn-primary btn-lg d-block w-100" type="button" id="add-members">Add Members</button></div>
                    <div class="mb-3"></div><button class="btn btn-primary btn-lg d-block w-100" type="button" id="start-scholarship">Start Scholarship</button></div>
                    <div class="mb-3"></div><button class="btn btn-primary btn-lg d-block w-100" type="button" id="view-applications">View Applications</button></div>
                    <div class="mb-3"></div><button class="btn btn-primary btn-lg d-block w-100" type="button" id="end-scholarship">End Scholarship</button></div>
                </form>
            </div>
        </section>
    </main>
    <script src="static/js/bootstrap.min.js"></script>
    <script src="static/js/bs-init.js"></script>
    <script src="static/js/Animated-Text-Background-animatedTextBackground.js"></script>
    <script src="static/js/pikaday.min.js"></script>
    <script src="static/js/theme.js"></script>
    <script>
        document.getElementById('add-members').addEventListener('click', function () {
                var fileInput = document.getElementById('fileInput');
                var file = fileInput.files[0];
                if (!file) {
                    alert('Please select a file to upload.');
                    return;
                }
                var formData = new FormData();
                formData.append('file', file);
                fetch('/add_applicants', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(result => {
                    if (result.status === 'success') {
                        alert('Members added successfully!');
                    } else {
                        alert('Failed to add members.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while adding members.');
                });
            });
    </script>
    <script>
        document.getElementById('start-scholarship').addEventListener('click', function () {
                fetch('/begin_scholarship_process', {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(result => {
                    if (result.status === 'success') {
                        alert('Scholarship Season has begun!');
                    } else {
                        alert('Scholarship Season has failed to start.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while starting the scholarship season.');
                });
            });
    </script>
    <script>
        document.getElementById('end-scholarship').addEventListener('click', function () {
                fetch('/close_scholarship_process', {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(result => {
                    if (result.status === 'success') {
                        alert('Scholarship Season has Ended!');
                    } else {
                        alert('Scholarship Season has failed to end.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while ending the scholarship season.');
                });
            });
    </script>
    <script>
        document.getElementById('view-applications').addEventListener('click', function () {
                window.location.href = '/application_view';
            });
    </script>
</body>

</html>
