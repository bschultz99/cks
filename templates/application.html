<!DOCTYPE html>
<html data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Application - HCAEPKS</title>
    <meta name="description" content="CKS Scholarship Website for the Alpha Epsilon Chapter of Phi Kappa Sigma">
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:300,400,700&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Actor&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Arbutus+Slab">
    <link rel="stylesheet" href="static/css/404-NOT-FOUND-animated-v2.compiled.css">
    <link rel="stylesheet" href="static/css/Animated-Text-Background.css">
    <link rel="stylesheet" href="static/css/Background-Image---Parallax---No-Text.css">
    <link rel="stylesheet" href="static/css/Login-Form-Basic-icons.css">
    <link rel="stylesheet" href="static/css/pikaday.min.css">
</head>

<body>
    <main class="page" style="background: url(&quot;static/img/geometric-leaves.webp&quot;);">
        <section class="portfolio-block hire-me">
            <div class="container">
                <div class="heading">
                    <h2 style="color: var(--bs-secondary);font-weight: bold;font-size: 44px;text-shadow: 7px 9px 10px var(--bs-secondary);">Scholarship Application</h2>
                </div>
                <form id="application-form" method = "post" class="border rounded border-1 shadow-lg p-3 p-md-5" data-bs-theme="light" style="background: #ffffff;">
                    <div>
                        <h1 style="text-align: center;">{{ applicant_first_name }}'s Application</h1>
                    </div>
                    <input type="hidden" id="email" name="email" value="{{ email }}">
                    <div id="General"><label class="form-label" style="font-weight: bold;font-size: 20px;">General</label>
                        <div class="mb-3"><label class="form-label" for="a_number">A Number</label><input class="form-control" type="text" id="a_number" name="a_number" required="" minlength="7" maxlength="11"></div>
                        <div class="mb-3"><label class="form-label" for="first_semester">When was your first semester at IIT?</label><input class="form-control" name="first_semester" id="first_semester" type="date" required=""></div>
                        <div class="mb-3"><label class="form-label" for="estimated_graduation">When are you expecting to graduate from IIT?</label><input class="form-control" name="estimated_graduation" id="estimated_graduation" type="date" required=""></div>
                        <div class="mb-3"><label class="form-label" for="active_next_year">Will you be an Active member next year?</label><select class="form-select" name="active_next_year" id="active_next_year" required="">
                                <option disabled selected value> -- select an option -- </option>
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                                <option value="Half">Yes - 1 Semester</option>
                            </select></div>
                        <div class="mb-3"><label class="form-label" for="live_in_house">Will you be living in the house next year?</label><select class="form-select" id="live_in_house" name="live_in_house" required="">
                                <option disabled selected value> -- select an option -- </option>
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                            </select></div>
                    </div>
                    <div id="Academics"><label class="form-label" style="font-weight: bold;font-size: 20px;">Academics</label>
                        <div class="mb-3"><label class="form-label" for="first_major">First Major</label><input class="form-control" type="text" id="first_major" name="first_major" required=""></div>
                        <div class="mb-3"><label class="form-label" for="second_major">Second Major (If you have one)</label><input class="form-control" type="text" name="second_major" id="second_major"></div>
                        <div class="mb-3"><label class="form-label" for="first_minor">First Minor (If you have one)</label><input class="form-control" type="text" name="first_minor" id="first_minor"></div>
                        <div class="mb-3"><label class="form-label" for="second_minor">Second Minor (If you have one)</label><input class="form-control" type="text" name="second_minor" id="second_minor"></div>
                        <div class="mb-3"><label class="form-label" for="cumulative_gpa">Cumulative GPA</label><input class="form-control" type="number" id="cumulative_gpa" name="cumulative_gpa" required="" min="0.0" max="4.0" step=".01"></div>
                        <div class="mb-3"><label class="form-label" for="previous_gpa">Previous Semester GPA</label><input class="form-control" type="number" id="previous_gpa" name="previous_gpa" required="" min="0.0" max="4.0" step=".01"></div>
                    </div>
                    <div id="Fraternity"><label class="form-label" style="font-weight: bold;font-size: 20px;">Fraternity</label>
                        <div class="mb-3"><label class="form-label" for="semester_initiated">When were you initiated into the Fraternity?</label><input class="form-control" id="semester_initiated" type="date" name="semester_initiated" required=""></div>
                        <div class="mb-3"><label class="form-label" for="executive_posions_held">How many Executive Board positions have you held in the fraternity?</label><input class="form-control" type="number"  id="executive_posions_held" name="executive_posions_held" required="" min="0" step="1"></div>
                        <div class="mb-3"><label class="form-label" for="other_positions_held">How many non-executive positions have you held in the fraternity?</label><input class="form-control" type="number" id="other_positions_held" name="other_positions_held" required="" min="0" step="1"></div>
                        <div class="mb-3"><label class="form-label" for="fraternity_conferences_attended">How many Fraternity Conferences have you attended?</label><input class="form-control" type="number" id="fraternity_conferences_attended" name="fraternity_conferences_attended" required="" min="0" step="1"></div>
                        <div class="mb-3"><label class="form-label" for="fraternity_text">Elaborate on what positions you have held and when as well as the contributions you have made in them. Elaborate on which conferences you have attended.</label><textarea class="form-control" id="fraternity_text" name="fraternity_text" required="" rows="5"></textarea><small class="text-muted d-block mt-2"><span id="count-fraternity_text">0</span> characters</small></div>
                    </div>
                    <div id="Organizations"><label class="form-label" style="font-weight: bold;font-size: 20px;">Organizations</label>
                        <div class="mb-3"><label class="form-label" for="semesters_involvement">How many semesters have you been involved in other IIT organizations?</label><input class="form-control" type="number" id="semesters_involvement" name="semesters_involvement" required="" min="0" step="1"></div>
                        <div class="mb-3"><label class="form-label" for="other_org_executive_positions_held">How many Executive positions have you held in&nbsp;other IIT organizations?</label><input class="form-control" type="number" name="other_org_executive_positions_held" id="other_org_executive_positions_held" required="" min="0" step="1"></div>
                        <div class="mb-3"><label class="form-label" for="other_org_positions_held">How many non-executive positions have you held in other IIT organizations?</label><input class="form-control" type="number" name="other_org_positions_held" id="other_org_positions_held" required="" min="0" step="1"></div>
                        <div class="mb-3"><label class="form-label" for="other_org_text">Elaborate on how you have been involved at IIT outside of the Fraternity.</label><textarea class="form-control" name="other_org_text" id="other_org_text" required="" rows="5"></textarea><small class="text-muted d-block mt-2"><span id="count-other_org_text">0</span> characters</small></div>
                    </div>
                    <div id="Community-Service"><label class="form-label" style="font-weight: bold;font-size: 20px;">Community Service</label>
                        <div class="mb-3"><label class="form-label" for="total_community_service_hours">What is the total&nbsp; hours of community service you have while in the fraternity?</label><input class="form-control" type="number" name="total_community_service_hours" id="total_community_service_hours" required="" min="0" step="1"></div>
                        <div class="mb-3"><label class="form-label" for="last_semester_community_service_hours">How many hours of community service did you complete last semester?</label><input class="form-control" type="number" name="last_semester_community_service_hours" id="last_semester_community_service_hours" required="" min="0" step="1"></div>
                        <div class="mb-3"><label class="form-label" for="community_service_text">Elaborate on what community service events you have been involved in.</label><textarea class="form-control" id="community_service_text" name="community_service_text" required="" rows="5"></textarea><small class="text-muted d-block mt-2"><span id="count-community_service_text">0</span> characters</small></div>
                    </div>
                    <div id="Essay-Questions"><label class="form-label" style="font-weight: bold;font-size: 20px;">Essay Questions</label>
                        <div class="mb-3"><label class="form-label" for="essay_question_1">What motivated you to join Phi Kappa Sigma? Which aspects of our fraternity align with you and why do you feel this is the right community for you?</label><textarea class="form-control" id="essay_question_1" name="essay_question_1" required="" rows="5"></textarea><small class="text-muted d-block mt-2"><span id="count-essay_question_1">0</span> characters</small></div>
                        <div class="mb-3"><label class="form-label" for="essay_question_2">Tell us about your current academic and personal involvements and your contributions to IIT, PKS, and your community? Include any leadership positions, extracurricular involvement, or community service.</label><textarea class="form-control" id="essay_question_2" name="essay_question_2" required="" rows="5"></textarea><small class="text-muted d-block mt-2"><span id="count-essay_question_2">0</span> characters</small></div>
                        <div class="mb-3"><label class="form-label" for="essay_question_3">What are your goals for your time in the fraternity and afterward? How do you plan to create positive change?</label><textarea class="form-control" id="essay_question_3" name="essay_question_3" required="" rows="5"></textarea><small class="text-muted d-block mt-2"><span id="count-essay_question_3">0</span> characters</small></div>
                        <div class="mb-3"><label class="form-label" for="essay_question_4">Describe any financial or personal challenges that may impact your fraternity participation or education.</label><textarea class="form-control" id="essay_question_4" name="essay_question_4" required="" rows="5"></textarea><small class="text-muted d-block mt-2"><span id="count-essay_question_4">0</span> characters</small></div>
                    </div>
                    <div id="Submit" class="mb-3">
                        <button class="btn btn-primary btn-lg d-block w-100" type="button" id="save-button">Save Application</button>
                        <div id="save-status" style="margin-top: 12px; text-align: center; display: none;"></div>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script src="static/js/bootstrap.min.js"></script>
    <script src="static/js/bs-init.js"></script>
    <script src="static/js/Animated-Text-Background-animatedTextBackground.js"></script>
    <script src="static/js/pikaday.min.js"></script>
    <script src="static/js/theme.js"></script>
    <script>
        // Character count trackers for textareas
        const characterCountFields = [
            'fraternity_text',
            'other_org_text',
            'community_service_text',
            'essay_question_1',
            'essay_question_2',
            'essay_question_3',
            'essay_question_4'
        ];

        // Initialize character counters and auto-save
        document.addEventListener('DOMContentLoaded', function () {
            var email = document.getElementById('email').value;
            
            // Load existing application data
            fetch(`/load_application?email=${encodeURIComponent(email)}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Error fetching application data: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.status !== 'no_data') {
                    Object.entries(data).forEach(([key, value]) => {
                        const inputElement = document.querySelector(`#${key}, textarea[name="${key}"], input[name="${key}"], select[name="${key}"]`);
                        if (inputElement) {
                            if (inputElement.type === 'date') {
                                value = new Date(value).toISOString().split('T')[0];
                            }
                            inputElement.value = value;
                            // Update character count if applicable
                            if (characterCountFields.includes(key)) {
                                updateCharacterCount(key);
                            }
                        }
                    });
                }
            })
            .catch(error => {
                console.error("Error loading application:", error);
                showSaveStatus('Error loading your application. Please refresh the page.', 'danger');
            });

            // Setup character counters
            characterCountFields.forEach(fieldName => {
                const element = document.getElementById(fieldName);
                if (element) {
                    element.addEventListener('input', function() {
                        updateCharacterCount(fieldName);
                    });
                }
            });

            // Setup auto-save on input changes (debounced)
            let autoSaveTimeout;
            const form = document.getElementById('application-form');
            form.addEventListener('input', function() {
                clearTimeout(autoSaveTimeout);
                autoSaveTimeout = setTimeout(autoSaveApplication, 3000);
            });
        });

        // Update character count display
        function updateCharacterCount(fieldName) {
            const element = document.getElementById(fieldName);
            const countElement = document.getElementById(`count-${fieldName}`);
            if (element && countElement) {
                countElement.textContent = element.value.length;
            }
        }

        // Auto-save function (silent save)
        function autoSaveApplication() {
            var form = document.getElementById('application-form');
            var formData = new FormData(form);
            var data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            fetch('/save_application', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    showSaveStatus('Auto-saved', 'success', true);
                }
            })
            .catch(error => {
                console.error('Auto-save error:', error);
            });
        }

        // Save status message display
        function showSaveStatus(message, type = 'info', autoHide = false) {
            const statusDiv = document.getElementById('save-status');
            statusDiv.textContent = message;
            statusDiv.className = `alert alert-${type} mb-0`;
            statusDiv.style.display = 'block';

            if (autoHide) {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            }
        }

        // Validate required fields
        function validateForm() {
            var form = document.getElementById('application-form');
            var isValid = true;
            var requiredFields = form.querySelectorAll('[required]');
            var emptyFields = [];

            requiredFields.forEach(function(field) {
                if (!field.value || field.value.trim() === '') {
                    isValid = false;
                    field.classList.add('is-invalid');
                    emptyFields.push(field.parentElement.querySelector('label').textContent);
                } else {
                    field.classList.remove('is-invalid');
                }
            });
            return {isValid: isValid, emptyFields: emptyFields};
        }

        // Manual save button click handler
        document.getElementById('save-button').addEventListener('click', function () {
            const button = this;
            const validation = validateForm();
            
            if (!validation.isValid) {
                showSaveStatus(`Please fill in all required fields. Missing: ${validation.emptyFields.join(', ')}`, 'warning');
                return;
            }

            // Show loading state
            button.disabled = true;
            button.textContent = 'Saving...';
            showSaveStatus('Saving your application...', 'info');
            
            var form = document.getElementById('application-form');
            var formData = new FormData(form);
            var data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            fetch('/save_application', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(result => {
                button.disabled = false;
                button.textContent = 'Save Application';
                if (result.status === 'success') {
                    showSaveStatus('✓ Application saved successfully!', 'success', true);
                } else {
                    showSaveStatus(`Error: ${result.message || 'Failed to save application'}`, 'danger');
                }
            })
            .catch(error => {
                button.disabled = false;
                button.textContent = 'Save Application';
                console.error('Save error:', error);
                showSaveStatus('Network error: Could not save application. Please check your connection.', 'danger');
            });
        });

        // Auto-save on page unload
        window.addEventListener('beforeunload', function (event) {
            var form = document.getElementById('application-form');
            var formData = new FormData(form);
            var data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            navigator.sendBeacon('/save_application', JSON.stringify(data));
        });
    </script>
</body>

</html>
